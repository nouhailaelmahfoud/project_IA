name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Lint du backend
        run: ruff check backend

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml
          tools: composer:v2
      - name: Dépendances PHP (plugin et Rector)
        run: |
          cd plugins/php_analyzer && composer install --no-interaction --no-dev
          cd ../../tools/rector && composer install --no-interaction
      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-agents.txt -r backend/requirements.txt
      - name: Tests
        run: python -m pytest tests -q --ignore=tests/test_verification.py
        env:
          PYTHONPATH: ${{ github.workspace }}

  build:
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Fichier .env factice (aucun secret réel)
        run: cp .env.example .env
      - name: Build des images Docker
        run: docker compose build