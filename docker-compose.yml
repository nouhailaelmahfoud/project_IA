services:
  redis:
    image: redis:7-alpine

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app

    volumes:
      - ./workspace:/app/workspace
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app

    volumes:
      - ./workspace:/app/workspace
    depends_on:
      - redis